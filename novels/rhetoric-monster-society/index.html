function b64Decode(str) {
    try {
        return decodeURIComponent(atob(str).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
    } catch(e) {
        return atob(str);
    }
}

var contentData;
try {
    contentData = JSON.parse(b64Decode(_B64.data));
} catch(e) {
    contentData = {};
}

var UI = {};
for (var key in _B64.ui) {
    if (_B64.ui.hasOwnProperty(key)) {
        UI[key] = b64Decode(_B64.ui[key]);
    }
}

document.title = UI.title_page;

if (svgTitleEl) svgTitleEl.textContent = UI.svg_title;

var copyrightEl = document.querySelector('.copyright');

var langHeaderEl = document.querySelector('.lang-menu-header');

var langOptions = document.querySelectorAll('.lang-option');
langOptions.forEach(function(btn, index) {
    var langKey = "lang_" + index;

});

var earthBtn = document.getElementById('earthToggle');
var langDrop = document.getElementById('langDrop');
var langListContainer = document.getElementById('langListContainer');
var displayBox = document.getElementById('displayBox');
var menuOpen = false;

function render(lang) {
    var e = contentData[lang];
    if (e) displayBox.innerText = e.body;
}

function openLangMenu() {
    menuOpen = true;
    langDrop.classList.remove("close-animation");
    langDrop.classList.add("open");
}

function closeLangMenu() {
    if (menuOpen) {
        menuOpen = false;
        langDrop.classList.remove("open");
        langDrop.classList.add("close-animation");
        setTimeout(function() {
            langDrop.classList.remove("close-animation");
        }, 320);
    }
}

earthBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    menuOpen ? closeLangMenu() : openLangMenu();
});

langListContainer.addEventListener('click', function(e) {
    var t = e.target.closest('.lang-option');
    if (t) {
        render(t.getAttribute('data-lang'));
        closeLangMenu();
    }
});

document.addEventListener('click', function() { closeLangMenu(); });
langDrop.addEventListener('click', function(e) { e.stopPropagation(); });

render("en");
