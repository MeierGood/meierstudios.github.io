<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meier Studios</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff; 
            font-family: 'Arial', sans-serif;
            text-align: center;
        }

        .content-box {
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            background: linear-gradient(
                90deg, 
                red, 
                orange, 
                yellow, 
                green, 
                blue, 
                indigo, 
                violet, 
                red
            );
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: rainbow-slide 4s linear infinite;
            margin: 0 0 60px 0;
            line-height: 1.2;
        }

        p {
            font-size: 1.5rem;
            color: #333333; 
            letter-spacing: 1px;
            margin: 0;
            font-weight: 300;
            line-height: 1.6;
        }

        @keyframes rainbow-slide {
            to {
                background-position: 200% center;
            }
        }
    </style>
</head>
<body>
    <div class="content-box">
        <h1>Meier Studios</h1>
        <p>The official website of Meier Studios is currently under construction,<br>and exciting content will be presented soon.</p>
    </div>
</body>
</html>
