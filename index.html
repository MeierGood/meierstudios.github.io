<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meier Studios</title>
    <link rel="icon" href="./forweb.ico">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #050505;
            overflow-x: hidden;
        }

        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: url('./forweb.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(0.6);
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            color: #ffffff;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .main-title {
            font-size: 5rem;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 20px;
            background: linear-gradient(
                90deg, 
                #a18cd1 0%, 
                #fbc2eb 25%, 
                #8fd3f4 50%, 
                #fbc2eb 75%, 
                #a18cd1 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: softFlow 6s linear infinite;
            text-shadow: 0 0 20px rgba(161, 140, 209, 0.3);
        }

        .sub-title {
            font-size: 1.3rem;
            font-weight: 300;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
            max-width: 800px;
            letter-spacing: 0.5px;
        }

        @keyframes softFlow {
            to {
                background-position: 200% center;
            }
        }

        @media (max-width: 768px) {
            .main-title {
                font-size: 3rem;
            }
            .sub-title {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-container"></div>
    <div class="content-wrapper">
        <h1 class="main-title">MEIER STUDIOS</h1>
        <p class="sub-title">
            The official website of Meier Studios is currently under construction,<br>
            and exciting content will be presented soon.
        </p>
    </div>
</body>
</html>
